[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-radar"
version = "0.2.0"
description = "Real-time observability dashboard for LLM applications. Track prompts, tokens, costs, and latency. One-line integration."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ganesh Mandakapu", email = "ganeshbalarajude@gmail.com" }]
keywords = ["llm", "observability", "monitoring", "fastapi", "openai", "anthropic", "gemini", "ollama", "dashboard", "ab-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.95.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
openai    = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
ollama    = ["ollama>=0.1.0"]
gemini    = ["google-generativeai>=0.5.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "ollama>=0.1.0",
    "google-generativeai>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx",
    "uvicorn",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
llm-radar = "llm_radar.cli:main"

[project.urls]
Homepage = "https://github.com/ganeshmandakapu/llm-radar"
Repository = "https://github.com/ganeshmandakapu/llm-radar"
"Bug Tracker" = "https://github.com/ganeshmandakapu/llm-radar/issues"

[tool.hatch.build.targets.wheel]
packages = ["llm_radar"]

[tool.hatch.build.targets.sdist]
include = ["/llm_radar", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py38"
